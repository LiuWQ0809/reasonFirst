name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve dependencies
        run: uv sync

      - name: Compile Python sources
        run: uv run python -m py_compile server.py smoke_test.py

      - name: Check that secrets are not committed
        shell: bash
        run: |
          test ! -f .env
          ! grep -R --exclude-dir=.git --exclude='.env.example' -E 'glpat-[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9_-]{20,}' .
